<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Dance Animation</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Base body style */
    body {
      background-color: #f1f5f9;
      /* slate-100 */
      color: #0f172a;
      /* slate-900 */
    }

    /* Card container */
    .card {
      background-color: #ffffff;
      /* white */
      border: 1px solid #e2e8f0;
      /* slate-200 */
      border-radius: 0.5rem;
      /* rounded-lg */
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1),
        0 1px 2px -1px rgba(0, 0, 0, 0.1);
      /* shadow-md */
    }

    /* Input/Select base styles */
    .input-base {
      display: block;
      width: 100%;
      padding: 0.5rem 0.75rem;
      /* py-2 px-3 */
      border: 1px solid #cbd5e1;
      /* slate-300 */
      border-radius: 0.375rem;
      /* rounded-md */
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      /* shadow-sm */
      font-size: 0.875rem;
      /* text-sm */
      line-height: 1.25rem;
      color: #0f172a;
      /* slate-900 */
      background-color: #ffffff;
      /* white */
      height: 41px;
    }

    .input-base:focus {
      outline: 2px solid transparent;
      outline-offset: 2px;
      border-color: #94a3b8;
      /* slate-400 */
      box-shadow: 0 0 0 2px #f1f5f9;
      /* ring-2 ring-slate-100 */
    }

    .input-base::placeholder {
      color: #64748b;
      /* slate-500 */
    }

    /* File Input Specific Styling */
    .input-file {
      display: block;
      width: 100%;
      font-size: 0.875rem;
      /* text-sm */
      color: #475569;
      /* slate-600 */
      border: 1px solid #cbd5e1;
      /* slate-300 */
      border-radius: 0.375rem;
      /* rounded-md */
      padding: 0.3rem;
      /* Adjust padding as needed */
      cursor: pointer;
    }

    /* Style the button that appears for file input */
    .input-file::file-selector-button {
      margin-right: 1rem;
      /* mr-4 */
      padding: 0.5rem 1rem;
      /* py-2 px-4 */
      border-radius: 0.375rem;
      /* rounded-md */
      border: none;
      font-size: 0.875rem;
      /* text-sm */
      font-weight: 600;
      /* font-semibold */
      background-color: #f1f5f9;
      /* bg-slate-100 */
      color: #334155;
      /* text-slate-700 */
      transition: background-color 0.2s ease;
    }

    .input-file::file-selector-button:hover {
      background-color: #e2e8f0;
      /* bg-slate-200 */
    }

    .input-file:focus {
      outline: 2px solid transparent;
      outline-offset: 2px;
      border-color: #94a3b8;
      /* slate-400 */
      box-shadow: 0 0 0 2px #f1f5f9;
      /* ring-2 ring-slate-100 */
    }

    /* Button base styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      /* py-2 px-4 */
      border-radius: 0.375rem;
      /* rounded-md */
      font-size: 0.875rem;
      /* text-sm */
      font-weight: 500;
      /* font-medium */
      transition: background-color 0.2s ease, color 0.2s ease,
        border-color 0.2s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn:focus {
      outline: 2px solid transparent;
      outline-offset: 2px;
      box-shadow: 0 0 0 2px #f1f5f9;
      /* ring-2 ring-slate-100 */
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Primary Button */
    .btn-primary {
      background-color: #0f172a;
      /* slate-900 */
      color: #ffffff;
      /* white */
      border-color: #0f172a;
      /* slate-900 */
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #1e293b;
      /* slate-800 */
      border-color: #1e293b;
      /* slate-800 */
    }

    /* Secondary/Toggle Button */
    .btn-secondary {
      background-color: #ffffff;
      /* white */
      color: #0f172a;
      /* slate-900 */
      border-color: #cbd5e1;
      /* slate-300 */
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f8fafc;
      /* slate-50 */
    }

    .btn-secondary.active {
      background-color: #f1f5f9;
      /* slate-100 */
      border-color: #94a3b8;
      /* slate-400 */
      color: #0f172a;
      /* slate-900 */
    }

    /* Toggle Button Group */
    .toggle-group {
      display: inline-flex;
      border-radius: 0.375rem;
      /* rounded-md */
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      /* shadow-sm */
    }

    .toggle-group .btn-secondary {
      border-radius: 0;
      /* Remove individual radius */
      border-left-width: 0;
      /* Remove inner borders */
    }

    .toggle-group .btn-secondary:first-child {
      border-top-left-radius: 0.375rem;
      /* rounded-l-md */
      border-bottom-left-radius: 0.375rem;
      border-left-width: 1px;
      /* Add border back to first */
    }

    .toggle-group .btn-secondary:last-child {
      border-top-right-radius: 0.375rem;
      /* rounded-r-md */
      border-bottom-right-radius: 0.375rem;
    }

    /* Flash Message / Error Display */
    .message-area {
      padding: 0.75rem 1rem;
      /* p-3 px-4 */
      margin-bottom: 1rem;
      /* mb-4 */
      border: 1px solid transparent;
      background-color: #f8fafc;
      /* slate-50 */
      color: #334155;
      /* slate-700 */
      border-radius: 0.375rem;
      /* rounded-md */
      font-size: 0.875rem;
      /* text-sm */
      min-height: 40px;
      /* Ensure it has some height even when empty */
      display: none;
      /* Hidden by default */
    }

    .message-area.error {
      background-color: #fef2f2;
      /* red-50 */
      border-color: #fca5a5;
      /* red-300 */
      color: #b91c1c;
      /* red-700 */
      display: block;
      /* Show on error */
    }

    .message-area.success {
      background-color: #eff6ff;
      /* blue-50 */
      border-color: #93c5fd;
      /* blue-300 */
      color: #1d4ed8;
      /* blue-700 */
      display: block;
      /* Show on success message */
    }

    .message-area p {
      margin: 0;
    }
  </style>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="card p-6 sm:p-8 w-full max-w-lg">
    <h1 class="text-xl sm:text-2xl font-semibold mb-6 text-center text-slate-900">
      Generate Dance Animation
    </h1>

    <!-- Area for dynamic messages (AJAX success/error) -->
    <div id="message-area" class="message-area" role="alert">
      <p id="message-text"></p>
    </div>

    <!-- Input Mode Toggle -->
    <div class="mb-6 text-center">
      <div class="toggle-group w-[100%]" role="group">
        <button type="button" id="toggle-upload" class="flex w-[100%] btn btn-secondary active">
          Upload Audio
        </button>
        <button type="button" id="toggle-select" class="flex w-[100%] btn btn-secondary">
          Select Predefined
        </button>
      </div>
    </div>

    <!-- Single Form for Both Modes -->
    <!-- Removed action attribute, submission handled by JS -->
    <form id="generation-form" enctype="multipart/form-data">
      <!-- Hidden input to track mode -->
      <input type="hidden" name="input_mode" id="input-mode" value="upload" />

      <!-- Upload Section -->
      <div id="upload-section" class="mb-4">
        <label for="music-file-input" class="block text-sm font-medium text-slate-700 mb-1 text-center">
          Upload a WAV music file:
        </label>
        <!-- 'required' attribute will be managed by JS -->
        <input id="music-file-input" name="music_file" type="file" accept=".wav" class="input-file" />
      </div>

      <!-- Select Predefined Section -->
      <div id="select-section" class="hidden mb-4">
        <label for="preselected-audio" class="block text-sm font-medium text-slate-700 mb-1 text-center">
          Select a predefined audio file:
        </label>
        <!-- 'required' attribute will be managed by JS -->
        <select id="preselected-audio" name="selected_audio_path" class="input-base">
          <option value="" disabled selected>-- Select Audio --</option>
          {% for audio_file in predefined_audio_files %}
          <option value="{{ audio_file }}">{{ audio_file }}</option>
          {% else %}
          <option value="" disabled>No predefined files found</option>
          {% endfor %}
        </select>
      </div>

      <!-- Genre Selection (Common for both modes) -->
      <div class="mb-6">
        <label for="genre-select" class="block text-sm font-medium text-slate-700 mb-1 text-center">
          Select Genre:
        </label>
        <select id="genre-select" name="genre" class="input-base" required>
          <option value="" disabled selected>-- Select Genre --</option>
          <option value="kpop">K-Pop</option>
          <option value="chinese">Chinese Dance</option>
          <option value="ballet">Ballet</option>
          <option value="modern">Modern Dance</option>
        </select>
      </div>

      <!-- Generate Button (Type Button to prevent default submit) -->
      <div class="text-center">
        <button id="generate-button" type="button" class="btn btn-primary w-full sm:w-auto" disabled>
          Generate
        </button>
      </div>
    </form>

    <p class="mt-6 text-xs text-slate-500 text-center">
      Powered by LODGE-LORA
    </p>
  </div>

  <script>
    const uploadButton = document.getElementById("toggle-upload");
    const selectButton = document.getElementById("toggle-select");
    const uploadSection = document.getElementById("upload-section");
    const selectSection = document.getElementById("select-section");
    const generateButton = document.getElementById("generate-button");
    const musicFileInput = document.getElementById("music-file-input");
    const preselectedAudio = document.getElementById("preselected-audio");
    const genreSelect = document.getElementById("genre-select");
    const generationForm = document.getElementById("generation-form");
    const inputModeHidden = document.getElementById("input-mode");
    const messageArea = document.getElementById("message-area");
    const messageText = document.getElementById("message-text");

    let isUploadMode = true; // Start in upload mode

    function showMessage(message, isError = false) {
      messageText.textContent = message;
      messageArea.className = `message-area ${isError ? "error" : "success"}`; // Apply error/success class
      messageArea.style.display = "block"; // Make sure it's visible
    }

    function hideMessage() {
      messageArea.style.display = "none";
      messageText.textContent = "";
      messageArea.className = "message-area"; // Reset classes
    }

    function checkGenerateButtonState() {
      const genreSelected = genreSelect.value !== "";
      let audioReady = false;

      if (isUploadMode) {
        audioReady = musicFileInput && musicFileInput.files.length > 0;
        musicFileInput.required = true;
        preselectedAudio.required = false;
      } else {
        audioReady = preselectedAudio.value !== "";
        musicFileInput.required = false;
        preselectedAudio.required = true;
      }

      generateButton.disabled = !(audioReady && genreSelected);
    }

    // --- Toggle Logic ---
    uploadButton.addEventListener("click", () => {
      if (!isUploadMode) {
        isUploadMode = true;
        inputModeHidden.value = "upload";
        uploadButton.classList.add("active");
        selectButton.classList.remove("active");
        uploadSection.classList.remove("hidden");
        selectSection.classList.add("hidden");
        preselectedAudio.value = "";
        hideMessage(); // Hide any previous messages
        checkGenerateButtonState();
      }
    });

    selectButton.addEventListener("click", () => {
      if (isUploadMode) {
        isUploadMode = false;
        inputModeHidden.value = "select";
        uploadButton.classList.remove("active");
        selectButton.classList.add("active");
        uploadSection.classList.add("hidden");
        selectSection.classList.remove("hidden");
        musicFileInput.value = null;
        hideMessage(); // Hide any previous messages
        checkGenerateButtonState();
      }
    });

    // --- Event Listeners for Enabling Generate Button ---
    musicFileInput.addEventListener("change", () => {
      hideMessage();
      checkGenerateButtonState();
    });
    preselectedAudio.addEventListener("change", () => {
      hideMessage();
      checkGenerateButtonState();
    });
    genreSelect.addEventListener("change", () => {
      hideMessage();
      checkGenerateButtonState();
    });

    // --- Generate Button Click Handler (AJAX Submission) ---
    generateButton.addEventListener("click", function () {
      // Basic validation check
      if (!genreSelect.value) {
        showMessage("Please select a genre.", true);
        genreSelect.focus();
        return;
      }
      if (
        isUploadMode &&
        (!musicFileInput.files || musicFileInput.files.length === 0)
      ) {
        showMessage("Please select a music file to upload.", true);
        musicFileInput.focus();
        return;
      }
      if (!isUploadMode && !preselectedAudio.value) {
        showMessage("Please select a predefined audio file.", true);
        preselectedAudio.focus();
        return;
      }

      // Disable button and show processing state
      generateButton.disabled = true;
      generateButton.textContent = "Processing...";
      hideMessage(); // Clear previous messages

      // Prepare form data
      const formData = new FormData(generationForm);

      // Send data using fetch
      fetch("{{ url_for('upload_and_generate') }}", {
        // Use the Flask URL generator
        method: "POST",
        body: formData, // FormData handles multipart/form-data automatically
      })
        .then((response) => {
          // Check if response is ok (status in the range 200-299)
          if (!response.ok) {
            // Try to parse error JSON, fallback to status text
            return response
              .json()
              .catch(() => {
                throw new Error(
                  `Server responded with status: ${response.status} ${response.statusText}`
                );
              })
              .then((errData) => {
                // Throw an error with the message from backend JSON if available
                throw new Error(
                  errData.error || `Server error: ${response.status}`
                );
              });
          }
          return response.json(); // Parse JSON body of the response
        })
        .then((data) => {
          // Handle success - expecting { job_id: '...' }
          if (data.job_id) {
            // Redirect to the results page
            window.location.href = `/results/${data.job_id}`;
          } else {
            // Unexpected success response format
            throw new Error(
              "Received an unexpected response from the server."
            );
          }
        })
        .catch((error) => {
          // Handle errors (network error or error thrown above)
          console.error("Submission error:", error);
          showMessage(`Error: ${error.message}`, true); // Display error message
          // Re-enable button and restore text
          generateButton.disabled = false;
          generateButton.textContent = "Generate";
        });
    });

    // Initial check and setup
    checkGenerateButtonState(); // Set initial button state and required fields
  </script>
</body>

</html>
